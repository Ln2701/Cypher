<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidden Cipher</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #000;
        color: #000;
        font-family: Consolas, "Courier New", monospace;
      }

      main {
        width: min(88vw, 980px);
      }

      .cipher {
        margin: 0;
        color: #000;
        font-size: clamp(0.95rem, 2vw, 1.25rem);
        line-height: 1.65;
        overflow-wrap: anywhere;
        user-select: text;
      }

      .cipher::selection {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <main aria-label="Hidden cipher">
      <p class="cipher">(4R,B,11)(5V,1H,Q)(8C,3,14)(1K,7,15)(1W,1K,S)(1H,1K,S)(54,O,10)(5N,6,17)(90,7,17)(5F,1F,P)(3C,0,1A)</p>
    </main>
  </body>
</html>
